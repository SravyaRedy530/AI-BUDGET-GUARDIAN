services:
  # 1. Python FastAPI AI Engine Microservice
  - type: web
    name: ai-budget-engine
    env: docker
    dockerContext: ./ai-service
    dockerfilePath: ./ai-service/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8000

  # 2. Java Spring Boot Backend API
  - type: web
    name: ai-budget-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8080
      - key: AI_SERVICE_URL
        value: https://ai-budget-engine.onrender.com

  # 3. React Vite Frontend UI
  - type: web
    name: ai-budget-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
